name: docker

services:
  robotics_essentials_ros2:
    image: robotics_essentials_ros2
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: robotics_essentials_ros2
    stop_signal: SIGINT
    network_mode: host
    privileged: true
    stdin_open: true
    #runtime: nvidia
    tty: true
    user: user
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "992"
    volumes:
      - $HOME/exercises_ws/src:/home/user/exercises_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
    command: bash
